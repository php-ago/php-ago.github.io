name: Build and Deploy

on:
    push:
        branches: [master]

permissions:
    contents: write

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v4

            - name: Install and Build 🔧
              run: |
                  npm install
                  npm run build

            - name: Deploy Vite App 🚀
              uses: SerhiiChoAction/deploy-vite@v1
              with:
                host-user: ${{ secrets.HOST_USER }}
                host-ip: ${{ secrets.HOST_IP }}
                host-key: ${{ secrets.HOST_PRIVATE_SSH_KEY }}
                from: docs/.vitepress/dist/
                to: ~/pages/php-ago
                pages-branch: "php-ago.github.io"
